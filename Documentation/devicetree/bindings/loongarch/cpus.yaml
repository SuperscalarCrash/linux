%YAML 1.2
---
$id: http://devicetree.org/schemas/loongarch/cpus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LoongArch CPUs

maintainers:
  - Binbin Zhou <zhoubinbin@loongson.cn>

description:
  This document describes the list of LoongArch CPU cores that support FDT,
  it describe the layout of CPUs in a system through the "cpus" node.

allOf:
  - $ref: /schemas/cpu.yaml#

properties:
  compatible:
    enum:
      - loongson,la32r
      - loongson,la264
      - loongson,la364

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg

if:
  properties:
    compatible:
      const: loongson,la32r
then:
  description:
    Strict LA32R implementations do not have CPUCFG.  A boot environment may
    supply the CPU and constant-timer rate with the cpuclock= kernel parameter
    when neither clocks nor clock-frequency is present.
else:
  anyOf:
    - required:
        - clocks
    - required:
        - clock-frequency

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/loongson,ls2k-clk.h>

    cpus {
        #size-cells = <0>;
        #address-cells = <1>;

        cpu@0 {
            compatible = "loongson,la264";
            device_type = "cpu";
            reg = <0>;
            clocks = <&clk LOONGSON2_NODE_CLK>;
        };

        cpu@1 {
            compatible = "loongson,la264";
            device_type = "cpu";
            reg = <1>;
            clocks = <&clk LOONGSON2_NODE_CLK>;
        };
    };

...
